name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ghdl/setup-ghdl@v1
        with:
          version: nightly
          backend: mcode
      - run: pip install numpy pillow pytest torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest -q
      - run: bash scripts/run_vhdl_tests.sh
